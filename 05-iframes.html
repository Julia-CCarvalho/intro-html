<!DOCTYPE html>

<body>
<h1>Oque é um Iframe?</h1>
<p>Iframe significa <strong> inline frame </strong></p>
<p>Ele permite que você <em>incorpore</em> outra página/documento dentro da sua própia página HTML.</p> 

<hr>

<h2>Criando um iframe básico</h2>
<iframe src="01-elementos-textuais.html" frameborder="0"></iframe>

<hr>

<h2>Explorando outras formas de trabalhar com o iframe</h2>
<h3>Incorporando o youtube</h3>

<iframe 
width="560"
 height="315"
  src="https://www.youtube.com/embed/ML5NbVeJuLA?si=hhw37vw94hgVS7UJ" 
  title="YouTube video player" 
  frameborder="0"
   allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope;
   picture-in-picture; web-share"
  referrerpolicy="strict-origin-when-cross-origin" 
   allowfullscreen
    ></iframe>

    <h3>Incorporando o maps</h3>
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.616168046095!2d-46.72795072548819!3d-23.54630386103757!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce56fa971a5e7d%3A0x6f6b8e0ec9daadd1!2sParque%20Villa-Lobos!5e0!3m2!1spt-BR!2sbr!4v1790212973641!5m2!1spt-BR!2sbr" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>


    
</body>
</html>
